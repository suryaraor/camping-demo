        </div>
      </div>
      <div className="form-group">
        <label className="form-label">Assigned Volunteer</label>
        <select className="form-select" value={form.Volunteer} onChange={e => setForm({...form, Volunteer: e.target.value})}>
          <option value="">Unassigned</option>
          {(volunteers||[]).map(v => <option key={v.Name} value={v.Name}>{v.Name}</option>)}
        </select>
      </div>
      <div className="modal-actions">
        <button className="btn btn-outline" onClick={onClose} disabled={saving}>Cancel</button>
        <button className="btn btn-primary" onClick={handleSave} disabled={saving || !form.Item.trim()}>
          {saving ? 'Saving…' : 'Save Changes'}
        </button>
      </div>
    </Modal>
  );
}

// ─── SHOPPING ─────────────────────────────────────────────────────────────────
function ShoppingView({ myName = '', saveName }) {
  const { data, loading, reload, setData } = useData('getShopping');
  const { data: volunteers } = useData('getVolunteers');
  const [showAdd, setShowAdd] = React.useState(false);
  const [pendingRow, setPendingRow] = React.useState(null);
  const [confirmState, setConfirmState] = React.useState(null); // { item, actingAs }
  const [pendingItem, setPendingItem]   = React.useState(null); // waiting for name pick
  const [form, setForm] = React.useState({ Meal:'Breakfast', Category:'Groceries', Item:'', Quantity:'', Store:'', Volunteer:'', Status:'Pending', Cost:0 });
  const [editItem, setEditItem] = React.useState(null);

  const handleSaveEdit = async (item, form) => {
    if (USE_MOCK_DATA) {
      const idx = mockState.shopping.findIndex(i => i._row === item._row);
      if (idx !== -1) mockState.shopping[idx] = { ...mockState.shopping[idx], ...form };
    }
    await api.post({ action: 'updateShoppingItem', id: item.ID, row: item._row, data: form });
    setData(prev => prev.map(i => i._row === item._row ? { ...i, ...form } : i));
  };

  // Group items by store + volunteer combination
  const byStore = React.useMemo(() => {
    if (!data) return {};
    const grouped = data.reduce((acc, item) => {
      const store = String(item.Store || 'Other').trim() || 'Other';
      const volunteer = String(item.Volunteer || '').trim() || 'Unassigned';
      const key = `${store}|||${volunteer}`;
      if (!acc[key]) acc[key] = { store, volunteer, items: [] };
      acc[key].items.push(item);
      return acc;
    }, {});
    // Sort so same-store sections are adjacent, then by volunteer name
    return Object.fromEntries(
      Object.entries(grouped).sort(([, a], [, b]) =>
        a.store.localeCompare(b.store) || a.volunteer.localeCompare(b.volunteer)
      )
    );
  }, [data]);

  const doToggle = async (item, newVolunteer) => {
    if (pendingRow !== null) return;
    setPendingRow(item._row);
    try {
      const newStatus = isDone(item.Status) ? 'Pending' : 'Purchased';
      const shouldReassign = newStatus === 'Purchased' && newVolunteer && newVolunteer !== item.Volunteer;
      if (USE_MOCK_DATA) {
        const idx = mockState.shopping.findIndex(i => i._row === item._row);
        if (idx !== -1) {
          mockState.shopping[idx].Status = newStatus;
          if (shouldReassign) mockState.shopping[idx].Volunteer = newVolunteer;
        }
      }
      await api.post({ action:'updateStatus', id:item.ID, row:item._row, status:newStatus });
      if (shouldReassign) await api.post({ action:'updateVolunteer', id:item.ID, volunteer:newVolunteer });
      setData(prev => prev.map(i => i._row === item._row
        ? { ...i, Status:newStatus, ...(shouldReassign ? { Volunteer:newVolunteer } : {}) }
        : i
      ));
    } finally {
      setPendingRow(null);
    }
  };

  const initiateToggle = (item) => {
    if (pendingRow !== null) return;
    const isMarkingDone = !isDone(item.Status);
    const assignedName = String(item.Volunteer || '').trim();
    const assignedToOther = isMarkingDone
      && assignedName && normalizeText(assignedName) !== 'unassigned'
      && !matchesVolunteer(assignedName, myName);
    if (assignedToOther) {
      if (!myName) { setPendingItem(item); } else { setConfirmState({ item, actingAs: myName }); }
      return;
    }
    doToggle(item, null);
  };

  const handlePickName = (name) => {
    saveName(name);
    setConfirmState({ item: pendingItem, actingAs: name });
    setPendingItem(null);
  };

  const handleAdd = async () => {
    if (!form.Item.trim()) return;
    const newItem = { ...form, ID:'s'+ Date.now(), _row: (data?.length||0)+2 };
    if (USE_MOCK_DATA) mockState.shopping.push(newItem);
    await api.post({ action:'addShoppingItem', data: newItem });
    setShowAdd(false);
    reload();
  };

  const purchased = data ? data.filter(i => isDone(i.Status)).length : 0;
  const total     = data ? data.length : 0;

  if (loading) return <div className="empty-state"><div className="emoji">⏳</div><p>Loading shopping list…</p></div>;

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">🛒 Shopping List</div>
          <div className="text-muted" style={{marginTop:4}}>{purchased} of {total} items done</div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>+ Add Item</button>
      </div>

      {/* Overall progress bar */}
      <div className="card" style={{padding:'12px 16px',marginBottom:20}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:6,fontSize:'.82rem',color:'var(--muted)'}}>
          <span>Overall Progress</span>
          <span>{total > 0 ? Math.round(purchased/total*100) : 0}%</span>
        </div>
        <div className="progress-bar-wrap">
          <div className="progress-bar" style={{width: total>0 ? `${purchased/total*100}%` : '0%'}} />
        </div>
      </div>

      {/* One section per store + volunteer */}
      {Object.entries(byStore).map(([key, { store, volunteer, items }]) => {
        const storeDone = items.filter(i => isDone(i.Status)).length;
        const allDone   = storeDone === items.length;
        return (
          <div key={key} className="store-section">
            <div className="store-section-header">
              <div style={{display:'flex',alignItems:'center',gap:8}}>
                <span className="store-section-name">🏪 {store}</span>
                <span className="store-volunteer">👤 {volunteer}</span>
                <span className="store-progress">{storeDone}/{items.length} done</span>
              </div>
              {allDone && <span className="store-all-done">✓ All Done!</span>}
            </div>

            <div className="item-tiles-grid">
              {items.map(item => {
                const isLoading = pendingRow === item._row;
                return (
                  <button
                    key={item._row}
                    className={`item-tile${isDone(item.Status) ? ' item-tile--done' : ''}${isLoading ? ' item-tile--loading' : ''}`}
                    onClick={() => initiateToggle(item)}
                    disabled={pendingRow !== null}
                  >
                    <div className="item-tile-edit-btn"
                      onClick={e => { e.stopPropagation(); setEditItem(item); }}
                      title="Edit item"
                    >✏️</div>
                    {isLoading
                      ? <div className="item-tile-spinner" />
                      : isDone(item.Status) && <div className="item-tile-check">✓</div>
                    }
                    <div className="item-tile-name">{item.Item}</div>
                    <div className="item-tile-qty">{item.Quantity}</div>
                    <div className="item-tile-meal">{MEAL_ICONS[item.Meal] || '🍽️'} {item.Meal}</div>
                  </button>
                );
              })}
            </div>
          </div>
        );
      })}

      {showAdd && (
        <Modal title="➕ Add Shopping Item" onClose={() => setShowAdd(false)}>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Meal</label>
              <select className="form-select" value={form.Meal} onChange={e => setForm({...form,Meal:e.target.value})}>
                <option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Supplies</option>
              </select>
            </div>
            <div className="form-group">
              <label className="form-label">Category</label>
              <select className="form-select" value={form.Category} onChange={e => setForm({...form,Category:e.target.value})}>
                <option>Groceries</option><option>Produce</option><option>Dairy</option><option>Supplies</option>
              </select>
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Item Name *</label>
            <input className="form-input" placeholder="e.g. Eggs" value={form.Item} onChange={e => setForm({...form,Item:e.target.value})} />
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Quantity</label>
              <input className="form-input" placeholder="e.g. 2 dozen" value={form.Quantity} onChange={e => setForm({...form,Quantity:e.target.value})} />
            </div>
            <div className="form-group">
              <label className="form-label">Store</label>
              <input className="form-input" placeholder="e.g. Costco" value={form.Store} onChange={e => setForm({...form,Store:e.target.value})} />
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Assigned Volunteer</label>
            <input className="form-input" placeholder="Name" value={form.Volunteer} onChange={e => setForm({...form,Volunteer:e.target.value})} />
          </div>
          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setShowAdd(false)}>Cancel</button>
            <button className="btn btn-primary" onClick={handleAdd}>Add Item</button>
          </div>
        </Modal>
      )}

      {/* Confirmation: item assigned to someone else */}
      {confirmState && (
        <Modal title="Confirm handoff" onClose={() => setConfirmState(null)}>
          <p style={{marginBottom:20,lineHeight:1.55}}>
            This item is assigned to <strong>{confirmState.item.Volunteer}</strong>.
            Mark it as done and move it under your name (<strong>{confirmState.actingAs}</strong>)?
          </p>
          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setConfirmState(null)}>Cancel</button>
            <button className="btn btn-primary" onClick={async () => {
              const s = confirmState;
              setConfirmState(null);
              await doToggle(s.item, s.actingAs);
            }}>Yes, mark as done</button>
          </div>
        </Modal>
      )}

      {/* Name picker: identity unknown */}
      {pendingItem && (
        <Modal title="Who are you?" onClose={() => setPendingItem(null)}>
          <p style={{marginBottom:16,fontSize:'.88rem',color:'var(--muted)'}}>Pick your name to continue.</p>
          <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:300,margin:'0 auto'}}>
            {(volunteers||[]).map(v => (
              <button key={v.Name} className="btn btn-outline"
                style={{textAlign:'left',padding:'12px 16px',display:'flex',alignItems:'center',gap:12}}
                onClick={() => handlePickName(v.Name)}>
                <div style={{width:36,height:36,borderRadius:10,background:'linear-gradient(135deg,var(--green2),var(--green3))',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:800,flexShrink:0}}>
                  {v.Name.charAt(0)}
                </div>
                <div>
                  <div style={{fontWeight:700}}>{v.Name}</div>
                  <div style={{fontSize:'.75rem',color:'var(--muted)'}}>{v.Family} · {v['Assigned Store']}</div>
                </div>
              </button>
            ))}
          </div>
        </Modal>
      )}

      {editItem && (
        <EditItemModal
          item={editItem}
          volunteers={volunteers}
          onClose={() => setEditItem(null)}
          onSave={handleSaveEdit}
        />
      )}
    </div>
  );
}

// ─── EXPENSE SETTLEMENT ALGORITHM (Splitwise-style) ────────────────────────────
function parseAppliesFamilies(value) {
  if (!value) return [];
  return String(value)
    .split('|')
    .map(v => v.trim())
    .filter(Boolean);
}

function parseAppliesCounts(value) {
  const out = {};
  if (!value) return out;
  String(value)
    .split('|')
    .map(v => v.trim())
    .filter(Boolean)
    .forEach(token => {
      const idx = token.lastIndexOf('::');
      if (idx <= 0) return;
      const family = token.slice(0, idx).trim();
      const count = parseFloat(token.slice(idx + 2));
      if (!family || !Number.isFinite(count)) return;
      out[family] = count;
    });
  return out;
}

function getExpensePayerFamilies(expense, allFamilies, volunteerToFamily, familyNameMap) {
  const manualFamilies = parseAppliesFamilies(expense['Paid By Families'])
    .map(name => familyNameMap[normalizeText(name)])
    .filter(Boolean);
  if (manualFamilies.length > 0) {
    return Array.from(new Set(manualFamilies));
  }
  const rawFamily = volunteerToFamily[normalizeText(expense.Volunteer || '')];
  const mappedFamily = rawFamily ? familyNameMap[normalizeText(rawFamily)] : null;
  return mappedFamily ? [mappedFamily] : [];
}

function buildFamilyMembers(signups, families) {
  const familyMembers = {};
  (signups || []).forEach(s => {
    const fam = String(s.Family || '').trim();
    if (!fam) return;
    familyMembers[fam] = (familyMembers[fam] || 0) + (parseInt(s.Members) || 0);
  });
  (families || []).forEach(f => {
    const fam = String(f['Family Name'] || '').trim();
    if (!fam || familyMembers[fam]) return;
    familyMembers[fam] = parseInt(f.Members) || 0;
  });
  return familyMembers;
}

function getExpenseWeights(expense, allFamilies, familyMembers) {
  const selected = parseAppliesFamilies(expense['Applies To Families']).filter(f => familyMembers[f] > 0);
  const applicableFamilies = selected.length > 0 ? selected : allFamilies;
  const customCounts = parseAppliesCounts(expense['Applies To Counts']);

  const weights = {};
  applicableFamilies.forEach(fam => {
    const members = familyMembers[fam] || 0;
    if (members <= 0) return;
    if (customCounts.hasOwnProperty(fam)) {
      const adjusted = Math.max(0, Math.min(members, customCounts[fam]));
      weights[fam] = adjusted;
      return;
    }
    weights[fam] = members;
  });

  let totalWeight = Object.values(weights).reduce((s, v) => s + v, 0);
  if (totalWeight <= 0) {
    applicableFamilies.forEach(fam => {
      const members = familyMembers[fam] || 0;
      if (members > 0) weights[fam] = members;
    });
    totalWeight = Object.values(weights).reduce((s, v) => s + v, 0);
  }

  return { weights, totalWeight };
}

function calculateSettlements(expenses, volunteers, families, signups) {
  if (!expenses?.length) return [];

  const volunteerToFamily = {};
  (volunteers || []).forEach(v => { volunteerToFamily[normalizeText(v.Name)] = v.Family; });

  const familyMembers = buildFamilyMembers(signups, families);
  const allFamilies = Object.entries(familyMembers).filter(([, members]) => members > 0).map(([family]) => family);
  if (!allFamilies.length) return [];

  const familyNameMap = {};
  allFamilies.forEach(f => { familyNameMap[normalizeText(f)] = f; });

  const familyPaid = {};
  allFamilies.forEach(f => { familyPaid[f] = 0; });
  expenses.forEach(e => {
    const amount = parseFloat(e.Amount) || 0;
    if (amount <= 0) return;
    const paidFamilies = getExpensePayerFamilies(e, allFamilies, volunteerToFamily, familyNameMap);
    if (!paidFamilies.length) return;
    const splitPaidAmount = amount / paidFamilies.length;
    paidFamilies.forEach(family => { familyPaid[family] = (familyPaid[family] || 0) + splitPaidAmount; });
  });

  const familyOwes = {};
  allFamilies.forEach(f => { familyOwes[f] = 0; });
  expenses.forEach(e => {
    const amount = parseFloat(e.Amount) || 0;
    if (amount <= 0) return;
    const { weights, totalWeight } = getExpenseWeights(e, allFamilies, familyMembers);
    if (totalWeight <= 0) return;
    Object.entries(weights).forEach(([fam, w]) => { familyOwes[fam] += amount * (w / totalWeight); });
  });

  const balances = {};
  allFamilies.forEach(fam => { balances[fam] = 0; });
  Object.entries(familyPaid).forEach(([family, spent]) => { balances[family] = (balances[family] || 0) + spent; });
  Object.entries(familyOwes).forEach(([family, owes]) => { balances[family] = (balances[family] || 0) - owes; });

  const debtors = [];
  const creditors = [];
  Object.entries(balances).forEach(([family, balance]) => {
    const roundedBalance = Math.round(balance * 100) / 100;
    if (roundedBalance < -0.01) debtors.push({ family, amount: Math.abs(roundedBalance) });
    else if (roundedBalance > 0.01) creditors.push({ family, amount: roundedBalance });
  });

  debtors.sort((a, b) => b.amount - a.amount);
  creditors.sort((a, b) => b.amount - a.amount);

  const settlements = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const debtor = debtors[i];
    const creditor = creditors[j];
    const amount = Math.min(debtor.amount, creditor.amount);
    settlements.push({ from: debtor.family, to: creditor.family, amount: Math.round(amount * 100) / 100 });
    debtor.amount -= amount;
    creditor.amount -= amount;
    if (debtor.amount < 0.01) i++;
    if (creditor.amount < 0.01) j++;
  }
  return settlements;
}

function calculateFamilySplit(expenses, volunteers, families, signups) {
  if (!expenses?.length) return [];

  const volunteerToFamily = {};
  (volunteers || []).forEach(v => { volunteerToFamily[normalizeText(v.Name)] = v.Family; });

  const familyMembers = buildFamilyMembers(signups, families);
  const allFamilies = Object.entries(familyMembers).filter(([, members]) => members > 0).map(([family]) => family);

  const familyNameMap = {};
  allFamilies.forEach(f => { familyNameMap[normalizeText(f)] = f; });

  const familyPaid = {};
  const familyOwes = {};
  allFamilies.forEach(f => { familyPaid[f] = 0; familyOwes[f] = 0; });

  expenses.forEach(e => {
    const amount = parseFloat(e.Amount) || 0;
    if (amount <= 0) return;
    const paidFamilies = getExpensePayerFamilies(e, allFamilies, volunteerToFamily, familyNameMap);
    if (paidFamilies.length > 0) {
      const splitPaidAmount = amount / paidFamilies.length;
      paidFamilies.forEach(family => { familyPaid[family] += splitPaidAmount; });
    }
    const { weights, totalWeight } = getExpenseWeights(e, allFamilies, familyMembers);
    if (totalWeight <= 0) return;
    Object.entries(weights).forEach(([fam, w]) => { familyOwes[fam] += amount * (w / totalWeight); });
  });

  return allFamilies.map(family => {
    const owed = Math.round(familyOwes[family] * 100) / 100;
    const paid = Math.round((familyPaid[family] || 0) * 100) / 100;
    const net = Math.round((paid - owed) * 100) / 100;
    return { family, members: familyMembers[family] || 0, cost: owed, paid, net };
  }).sort((a, b) => b.cost - a.cost);
}

function computeFamilyExpenseBreakdown(familyName, expenses, volunteers, families, signups) {
  if (!expenses?.length || !familyName) return [];

  const volunteerToFamily = {};
  (volunteers || []).forEach(v => { volunteerToFamily[normalizeText(v.Name)] = v.Family; });

  const familyMembers = buildFamilyMembers(signups, families);
  const allFamilies = Object.entries(familyMembers).filter(([, m]) => m > 0).map(([f]) => f);

  return expenses
    .map(e => {
      const amount = parseFloat(e.Amount) || 0;
      if (amount <= 0) return null;
      const { weights, totalWeight } = getExpenseWeights(e, allFamilies, familyMembers);
      const portionCount = weights[familyName] || 0;
      if (portionCount <= 0) return null;
      return { expense: e, portionCount, totalPortionCount: totalWeight, familyShare: amount * (portionCount / totalWeight) };
    })
    .filter(Boolean);
}

// ─── EXPENSES ─────────────────────────────────────────────────────────────────
function ExpensesView() {
  const { data: expenses, loading: exLoading, reload, setData: setExpensesData } = useData('getExpenses');
  const { data: summary,  loading: sumLoading }        = useData('getSummary');
  const { data: volunteers } = useData('getVolunteers');
  const { data: families } = useData('getFamilies');
  const { data: signups } = useData('getSignups');
  const [showAdd, setShowAdd] = React.useState(false);
  const [editExpense, setEditExpense] = React.useState(null);
  const [savingEdit, setSavingEdit] = React.useState(false);
  const [selectedFamily, setSelectedFamily] = React.useState(null);
  const [form, setForm] = React.useState({
    Volunteer:'', Store:'', Item:'', Amount:'', Date: new Date().toISOString().split('T')[0],
    appliesToAll: true, selectedFamilies: [], useCustomCounts: false, customCounts: {}
  });
  const [editForm, setEditForm] = React.useState({
    Volunteer:'', Store:'', Item:'', Amount:'', Date: new Date().toISOString().split('T')[0],
    splitFamilies: [], paidFamilies: [], customCounts: {}
  });
  const [rawCounts, setRawCounts] = React.useState({});

  const familyMembersMap = React.useMemo(() => buildFamilyMembers(signups, families), [signups, families]);

  const familyOptions = React.useMemo(() => {
    const fromSignups = new Set((signups || []).map(s => String(s.Family || '').trim()).filter(Boolean));
    const fromFamilies = (families || []).map(f => String(f['Family Name'] || '').trim()).filter(Boolean);
    return Array.from(new Set([...fromSignups, ...fromFamilies])).sort((a, b) => a.localeCompare(b));
  }, [signups, families]);

  const volunteerToFamily = React.useMemo(() => {
    const out = {};
    (volunteers || []).forEach(v => { out[normalizeText(v.Name)] = String(v.Family || '').trim(); });
    return out;
  }, [volunteers]);

  const familySplit = React.useMemo(() => calculateFamilySplit(expenses, volunteers, families, signups), [expenses, volunteers, families, signups]);

  const familyBreakdown = React.useMemo(() => {
    return computeFamilyExpenseBreakdown(selectedFamily, expenses, volunteers, families, signups)
      .sort((a, b) => b.familyShare - a.familyShare);
  }, [selectedFamily, expenses, volunteers, families, signups]);

  const settlements = React.useMemo(() => calculateSettlements(expenses, volunteers, families, signups), [expenses, volunteers, families, signups]);

  const handleAdd = async () => {
    if (!form.Volunteer.trim() || !form.Amount) return;
    const selectedFamilies = form.appliesToAll ? [] : (form.selectedFamilies || []);
    if (!form.appliesToAll && selectedFamilies.length === 0) return;

    const applicableFamilies = form.appliesToAll ? familyOptions : selectedFamilies;
    const customCounts = {};
    if (form.useCustomCounts) {
      for (const fam of applicableFamilies) {
        const maxMembers = familyMembersMap[fam] || 0;
        if (maxMembers <= 0) continue;
        const raw = parseFloat(form.customCounts?.[fam]);
        if (!Number.isFinite(raw) || raw <= 0) continue;
        const value = Math.min(maxMembers, raw);
        if (value < maxMembers) customCounts[fam] = value;
      }
    }

    const entry = {
      Volunteer: form.Volunteer,
      Store: form.Store,
      Item: form.Item,
      Amount: parseFloat(form.Amount) || 0,
      Date: form.Date,
      'Applies To Families': selectedFamilies.join('|'),
      'Applies To Counts': Object.entries(customCounts).map(([fam, count]) => `${fam}::${count}`).join('|'),
    };
    if (USE_MOCK_DATA) mockState.expenses.push({ ...entry, _row: mockState.expenses.length+2 });
    await api.post({ action:'addExpense', data: entry });
    setShowAdd(false);
    setForm({
      Volunteer:'', Store:'', Item:'', Amount:'', Date: new Date().toISOString().split('T')[0],
      appliesToAll: true, selectedFamilies: [], useCustomCounts: false, customCounts: {}
    });
    reload();
  };

  const openEditExpense = React.useCallback((expense) => {
    if (!expense) return;
    const selectedSplit = parseAppliesFamilies(expense['Applies To Families']);
    const defaultSplit = selectedSplit.length > 0 ? selectedSplit : [...familyOptions];
    const parsedCounts = parseAppliesCounts(expense['Applies To Counts']);
    const manualPaid = parseAppliesFamilies(expense['Paid By Families']);
    const defaultPaid = manualPaid.length > 0
      ? manualPaid
      : (() => {
          const fam = volunteerToFamily[normalizeText(expense.Volunteer || '')];
          return fam ? [fam] : [];
        })();
    const finalSplitFamilies = defaultSplit.filter(f => familyOptions.includes(f));
    const finalPaidFamilies  = defaultPaid.filter(f => familyOptions.includes(f));
    setEditExpense(expense);
    setRawCounts({});
    setEditForm({
      Volunteer: expense.Volunteer || '',
      Store: expense.Store || '',
      Item: expense.Item || '',
      Amount: expense.Amount === undefined || expense.Amount === null ? '' : String(expense.Amount),
      Date: toDateStr(expense.Date) || new Date().toISOString().split('T')[0],
      splitFamilies: finalSplitFamilies,
      customCounts: parsedCounts,
      paidFamilies: finalPaidFamilies,
    });
  }, [familyOptions, volunteerToFamily]);

  const toggleFamilyValue = (field, family, checked) => {
    const current = editForm[field] || [];
    const next = checked
      ? Array.from(new Set([...current, family]))
      : current.filter(f => f !== family);
    setEditForm({ ...editForm, [field]: next });
  };

  const getPaidFamiliesLabel = (expense) => {
    const manualPaid = parseAppliesFamilies(expense['Paid By Families']);
    if (manualPaid.length > 0) return manualPaid.join(', ');
    const family = volunteerToFamily[normalizeText(expense.Volunteer || '')];
    return family || 'Not mapped';
  };

  const handleSaveEdit = async () => {
    if (!editExpense) return;
    const amount = parseFloat(editForm.Amount);
    if (!Number.isFinite(amount) || amount <= 0) return;

    const splitFamilies = Array.from(new Set(editForm.splitFamilies || []));
    const paidFamilies  = Array.from(new Set(editForm.paidFamilies  || []));

    const customCounts = {};
    splitFamilies.forEach(fam => {
      const maxMembers = familyMembersMap[fam] || 0;
      const val = editForm.customCounts?.[fam];
      if (Number.isFinite(val) && val > 0 && val < maxMembers) customCounts[fam] = val;
    });

    const allKnownFamilies = familyOptions.length > 0 ? familyOptions : splitFamilies;
    const isFullSplit = splitFamilies.length === 0
      || (allKnownFamilies.length > 0 && splitFamilies.length === allKnownFamilies.length && Object.keys(customCounts).length === 0);
    const appliesToFamilies = isFullSplit ? '' : splitFamilies.join('|');

    const payload = {
      Volunteer: editForm.Volunteer,
      Store: editForm.Store,
      Item: editForm.Item,
      Amount: amount,
      Date: editForm.Date,
      'Applies To Families': appliesToFamilies,
      'Applies To Counts': Object.entries(customCounts).map(([fam, count]) => `${fam}::${count}`).join('|'),
      'Paid By Families': paidFamilies.join('|'),
    };

    setSavingEdit(true);
    try {
      if (USE_MOCK_DATA) {
        mockState.expenses = (mockState.expenses || []).map(e =>
          e._row === editExpense._row ? { ...e, ...payload } : e
        );
      }
      setExpensesData(prev => (prev || []).map(e => e._row === editExpense._row ? { ...e, ...payload } : e));
      await api.post({ action: 'updateExpense', row: editExpense._row, data: payload });
      setEditExpense(null);
      reload();
    } catch (err) {
      console.error('updateExpense failed:', err);
    } finally {
      setSavingEdit(false);
    }
  };

  if (exLoading || sumLoading) return <div className="empty-state"><div className="emoji">⏳</div><p>Loading expenses…</p></div>;

  return (
    <div>
      <div className="section-header">
        <div className="section-title">💰 Expenses & Cost Split</div>
        <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>+ Log Expense</button>
      </div>

      <div className="stats-grid">
        <div className="stat-card">
          <div className="stat-value">${summary?.totalCost?.toFixed(2) || '0.00'}</div>
          <div className="stat-label">Total Spent</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{summary?.totalPeople || 0}</div>
          <div className="stat-label">Participants</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">${summary?.costPerPerson?.toFixed(2) || '0.00'}</div>
          <div className="stat-label">Per Person</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{Object.keys(summary?.byStore || {}).length}</div>
          <div className="stat-label">Stores</div>
        </div>
      </div>

      {summary?.byStore && Object.keys(summary.byStore).length > 0 && (
        <div className="card">
          <div className="card-header"><div className="card-title">By Store</div></div>
          {Object.entries(summary.byStore).map(([store, amt]) => (
            <div key={store} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:'1px solid var(--border)'}}>
              <span className="store-tag">🏪 {store}</span>
              <span style={{fontWeight:700,color:'var(--green)'}}>${amt.toFixed(2)}</span>
            </div>
          ))}
        </div>
      )}

      {familySplit.length > 0 && (
        <div className="card">
          <div className="card-header">
            <div className="card-title">👨‍👩‍👧‍👦 Cost Split by Family</div>
            <div style={{fontSize:'.72rem',color:'var(--muted)'}}>Tap a row to see breakdown</div>
          </div>
          {familySplit.map(f => (
            <div key={f.family} className="family-row" onClick={() => setSelectedFamily(f.family)}
              style={{cursor:'pointer'}} title="Click to see expense breakdown">
              <div className="family-avatar">🏕️</div>
              <div>
                <div style={{fontWeight:600}}>{f.family}</div>
                <div style={{fontSize:'.78rem',color:'var(--muted)'}}>{f.members} members</div>
              </div>
              <div style={{textAlign:'right', marginLeft:'auto'}}>
                <div className="family-cost">${f.cost.toFixed(2)}</div>
                <div style={{fontSize:'.72rem',color:'var(--muted)'}}>paid ${f.paid.toFixed(2)}</div>
                <div style={{fontSize:'.74rem',fontWeight:700,color:f.net >= 0 ? '#16a34a' : '#e76f51'}}>
                  {f.net >= 0 ? `gets $${Math.abs(f.net).toFixed(2)}` : `owes $${Math.abs(f.net).toFixed(2)}`}
                </div>
              </div>
              <div style={{marginLeft:8,color:'var(--muted)',fontSize:'1rem'}}>›</div>
            </div>
          ))}
        </div>
      )}

      {selectedFamily && (
        <Modal title={`📋 ${selectedFamily} — Expense Breakdown`} onClose={() => setSelectedFamily(null)}>
          {familyBreakdown.length === 0
            ? <div style={{color:'var(--muted)',textAlign:'center',padding:'20px 0'}}>No expenses found for this family.</div>
            : (
              <div style={{display:'flex',flexDirection:'column',gap:0}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr auto auto auto',gap:'6px 10px',
                  fontSize:'.7rem',fontWeight:700,color:'var(--muted)',textTransform:'uppercase',
                  letterSpacing:'.05em',padding:'0 0 8px',borderBottom:'2px solid var(--border)'}}>
                  <span>Item / Store</span>
                  <span style={{textAlign:'right'}}>Total</span>
                  <span style={{textAlign:'right'}}>Portions</span>
                  <span style={{textAlign:'right'}}>Your Share</span>
                </div>
                {familyBreakdown.map(({ expense: e, portionCount, totalPortionCount, familyShare }, i) => (
                  <div key={i} style={{display:'grid',gridTemplateColumns:'1fr auto auto auto',gap:'6px 10px',
                    padding:'10px 0',borderBottom:'1px solid var(--border)',alignItems:'start'}}>
                    <div>
                      <div style={{fontWeight:600,fontSize:'.85rem'}}>{e.Item || '—'}</div>
                      <div style={{fontSize:'.72rem',color:'var(--muted)'}}>{e.Store} · {e.Volunteer}</div>
                      {e.Date && <div style={{fontSize:'.68rem',color:'var(--muted)'}}>{e.Date}</div>}
                    </div>
                    <div style={{textAlign:'right',fontWeight:600,fontSize:'.85rem',whiteSpace:'nowrap'}}>
                      ${(parseFloat(e.Amount)||0).toFixed(2)}
                    </div>
                    <div style={{textAlign:'right',fontSize:'.82rem',color:'var(--muted)',whiteSpace:'nowrap'}}>
                      {portionCount}/{totalPortionCount}
                    </div>
                    <div style={{textAlign:'right',fontWeight:700,fontSize:'.85rem',color:'var(--green)',whiteSpace:'nowrap'}}>
                      ${familyShare.toFixed(2)}
                    </div>
                  </div>
                ))}
                <div style={{display:'grid',gridTemplateColumns:'1fr auto auto auto',gap:'6px 10px',
                  padding:'12px 0 0',fontWeight:700,fontSize:'.9rem'}}>
                  <span>Total</span>
                  <span style={{textAlign:'right'}}>
                    ${familyBreakdown.reduce((s,r) => s+(parseFloat(r.expense.Amount)||0),0).toFixed(2)}
                  </span>
                  <span></span>
                  <span style={{textAlign:'right',color:'var(--green)'}}>
                    ${familyBreakdown.reduce((s,r) => s+r.familyShare,0).toFixed(2)}
                  </span>
                </div>
              </div>
            )
          }
        </Modal>
      )}

      {settlements.length > 0 && (
        <div className="card">
          <div className="card-header" style={{marginBottom:'16px'}}>
            <div className="card-title">💸 Settlement Plan (Minimized Transfers)</div>
            <div style={{fontSize:'.75rem',background:'#f0fdf4',color:'#16a34a',padding:'4px 10px',borderRadius:'12px',fontWeight:600}}>
              {settlements.length} {settlements.length === 1 ? 'transfer' : 'transfers'}
            </div>
          </div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {settlements.map((s, i) => (
              <div key={i} style={{
                display:'flex',alignItems:'center',gap:12,padding:'12px 14px',
                background:'linear-gradient(135deg, rgba(45,106,79,.04) 0%, rgba(116,198,157,.04) 100%)',
                borderRadius:'10px',border:'1px solid var(--border)',
              }}>
                <div style={{flex:1}}>
                  <div style={{fontWeight:600,fontSize:'.95rem'}}>
                    <span style={{color:'var(--green)'}}>{s.from}</span>
                    <span style={{color:'var(--muted)',margin:'0 6px'}}>→</span>
                    <span style={{color:'var(--green)'}}>{s.to}</span>
                  </div>
                  <div style={{fontSize:'.75rem',color:'var(--muted)',marginTop:2}}>{s.from} transfers to {s.to}</div>
                </div>
                <div style={{fontSize:'1.15rem',fontWeight:800,color:'var(--green)',whiteSpace:'nowrap',padding:'6px 12px',background:'rgba(116,198,157,.15)',borderRadius:'8px'}}>
                  ${s.amount.toFixed(2)}
                </div>
              </div>
            ))}
          </div>
          <div style={{marginTop:'14px',padding:'10px 12px',background:'#f8f9fa',borderRadius:'8px',fontSize:'.8rem',color:'var(--muted)',textAlign:'center',fontStyle:'italic'}}>
            💡 This is the minimum number of transfers needed to settle all expenses
          </div>
        </div>
      )}

      <div className="card">
        <div className="card-header"><div className="card-title">All Logged Expenses</div></div>
        <div style={{overflowX:'auto'}}>
          <table className="expense-table">
            <thead>
              <tr><th>Volunteer</th><th>Store</th><th>Item</th><th>Split</th><th>Amount</th><th>Date</th><th></th></tr>
            </thead>
            <tbody>
              {(expenses||[]).map((e,i) => (
                <tr key={i} className="expense-row-editable" onClick={() => openEditExpense(e)}>
                  <td style={{fontWeight:600}}>{e.Volunteer}</td>
                  <td><span className="store-tag">{e.Store}</span></td>
                  <td>{e.Item}</td>
                  <td style={{color:'var(--muted)',fontSize:'.78rem'}}>
                    {e['Applies To Families'] ? String(e['Applies To Families']).split('|').join(', ') : 'All families'}
                    <div style={{fontSize:'.72rem',marginTop:2}}>paid by: {getPaidFamiliesLabel(e)}</div>
                    {e['Applies To Counts'] && (
                      <div style={{fontSize:'.72rem',marginTop:2}}>
                        {String(e['Applies To Counts']).split('|').map(v => v.replace('::', ': ')).join(', ')}
                      </div>
                    )}
                  </td>
                  <td style={{fontWeight:700,color:'var(--green)'}}>${Number(e.Amount).toFixed(2)}</td>
                  <td style={{color:'var(--muted)'}}>{toDateStr(e.Date)}</td>
                  <td style={{color:'var(--muted)',fontSize:'.75rem',whiteSpace:'nowrap'}}>✏️</td>
                </tr>
              ))}
              {(!expenses || expenses.length===0) && (
                <tr><td colSpan={6} style={{textAlign:'center',color:'var(--muted)',padding:'24px'}}>No expenses logged yet</td></tr>
              )}
            </tbody>
          </table>
        </div>
      </div>

      {showAdd && (
        <Modal title="💸 Log an Expense" onClose={() => setShowAdd(false)}>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Volunteer *</label>
              {volunteers && volunteers.length > 0 ? (
                <select className="form-input" value={form.Volunteer} onChange={e => setForm({...form,Volunteer:e.target.value})}>
                  <option value="">Select volunteer…</option>
                  {volunteers.map(v => (
                    <option key={v.Name} value={v.Name}>{v.Name}{v.Family ? ` (${v.Family})` : ''}</option>
                  ))}
                </select>
              ) : (
                <input className="form-input" placeholder="Your name" value={form.Volunteer} onChange={e => setForm({...form,Volunteer:e.target.value})} />
              )}
            </div>
            <div className="form-group">
              <label className="form-label">Store</label>
              <input className="form-input" placeholder="e.g. Costco" value={form.Store} onChange={e => setForm({...form,Store:e.target.value})} />
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Item(s) Purchased</label>
            <input className="form-input" placeholder="What did you buy?" value={form.Item} onChange={e => setForm({...form,Item:e.target.value})} />
          </div>
          <div className="form-group">
            <label className="form-label">Who should split this item?</label>
            <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'.84rem',marginBottom:8,cursor:'pointer'}}>
              <input
                type="checkbox"
                checked={form.appliesToAll}
                onChange={e => setForm({
                  ...form,
                  appliesToAll: e.target.checked,
                  selectedFamilies: e.target.checked ? [] : form.selectedFamilies,
                })}
              />
              Apply to all families
            </label>
            {!form.appliesToAll && (
              <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,padding:'10px',border:'1px solid var(--border)',borderRadius:8,maxHeight:150,overflowY:'auto'}}>
                {familyOptions.map(family => {
                  const checked = form.selectedFamilies.includes(family);
                  return (
                    <label key={family} style={{display:'flex',alignItems:'center',gap:6,fontSize:'.82rem',cursor:'pointer'}}>
                      <input
                        type="checkbox"
                        checked={checked}
                        onChange={e => {
                          const next = e.target.checked
                            ? [...form.selectedFamilies, family]
                            : form.selectedFamilies.filter(f => f !== family);
                          const nextCounts = { ...(form.customCounts || {}) };
                          if (e.target.checked) {
                            if (!nextCounts.hasOwnProperty(family)) nextCounts[family] = familyMembersMap[family] || 1;
                          } else {
                            delete nextCounts[family];
                          }
                          setForm({ ...form, selectedFamilies: next, customCounts: nextCounts });
                        }}
                      />
                      {family}
                    </label>
                  );
                })}
              </div>
            )}
            {!form.appliesToAll && form.selectedFamilies.length === 0 && (
              <div style={{fontSize:'.74rem',color:'#b45309',marginTop:6}}>Select at least one family for this item.</div>
            )}
            <label style={{display:'flex',alignItems:'center',gap:8,fontSize:'.84rem',marginTop:10,cursor:'pointer'}}>
              <input
                type="checkbox"
                checked={form.useCustomCounts}
                onChange={e => {
                  const checked = e.target.checked;
                  if (!checked) { setForm({ ...form, useCustomCounts: false }); return; }
                  const familiesForCounts = form.appliesToAll ? familyOptions : form.selectedFamilies;
                  const nextCounts = { ...(form.customCounts || {}) };
                  familiesForCounts.forEach(fam => {
                    if (!nextCounts.hasOwnProperty(fam)) nextCounts[fam] = familyMembersMap[fam] || 1;
                  });
                  setForm({ ...form, useCustomCounts: true, customCounts: nextCounts });
                }}
              />
              Use custom participant count per family
            </label>
            {form.useCustomCounts && (
              <div style={{marginTop:10,padding:'10px',border:'1px solid var(--border)',borderRadius:8}}>
                <div style={{fontSize:'.76rem',color:'var(--muted)',marginBottom:8}}>
                  Default is full family size. Reduce counts for this expense where needed.
                </div>
                <div style={{display:'grid',gridTemplateColumns:'1fr 90px 90px',gap:8,alignItems:'center'}}>
                  <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--muted)'}}>Family</div>
                  <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--muted)'}}>Members</div>
                  <div style={{fontSize:'.72rem',fontWeight:700,color:'var(--muted)'}}>Split Count</div>
                  {(form.appliesToAll ? familyOptions : form.selectedFamilies).map(fam => {
                    const maxMembers = familyMembersMap[fam] || 0;
                    const val = form.customCounts?.[fam] ?? maxMembers;
                    return (
                      <React.Fragment key={fam}>
                        <div style={{fontSize:'.82rem'}}>{fam}</div>
                        <div style={{fontSize:'.8rem',color:'var(--muted)'}}>{maxMembers}</div>
                        <input
                          className="form-input"
                          type="number" min="1" max={String(Math.max(1, maxMembers))} step="1"
                          value={val}
                          onChange={e => {
                            const n = parseInt(e.target.value) || 1;
                            const bounded = Math.max(1, Math.min(maxMembers || 1, n));
                            setForm({ ...form, customCounts: { ...(form.customCounts || {}), [fam]: bounded } });
                          }}
                          style={{padding:'6px 8px',fontSize:'.8rem'}}
                        />
                      </React.Fragment>
                    );
                  })}
                </div>
              </div>
            )}
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Amount ($) *</label>
              <input className="form-input" type="number" step="0.01" min="0" placeholder="0.00" value={form.Amount} onChange={e => setForm({...form,Amount:e.target.value})} />
            </div>
            <div className="form-group">
              <label className="form-label">Date</label>
              <input className="form-input" type="date" value={form.Date} onChange={e => setForm({...form,Date:e.target.value})} />
            </div>
          </div>
          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setShowAdd(false)}>Cancel</button>
            <button className="btn btn-primary" onClick={handleAdd} disabled={!form.appliesToAll && form.selectedFamilies.length===0}>Log Expense</button>
          </div>
        </Modal>
      )}

      {editExpense && (
        <Modal title="✏️ Edit Expense" onClose={() => setEditExpense(null)}>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Volunteer</label>
              {volunteers && volunteers.length > 0 ? (
                <select className="form-input" value={editForm.Volunteer} onChange={e => setEditForm({ ...editForm, Volunteer: e.target.value })}>
                  <option value="">Select volunteer…</option>
                  {volunteers.map(v => (
                    <option key={v.Name} value={v.Name}>{v.Name}{v.Family ? ` (${v.Family})` : ''}</option>
                  ))}
                </select>
              ) : (
                <input className="form-input" value={editForm.Volunteer} onChange={e => setEditForm({ ...editForm, Volunteer: e.target.value })} />
              )}
            </div>
            <div className="form-group">
              <label className="form-label">Store</label>
              <input className="form-input" value={editForm.Store} onChange={e => setEditForm({ ...editForm, Store: e.target.value })} />
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Item(s)</label>
            <input className="form-input" value={editForm.Item} onChange={e => setEditForm({ ...editForm, Item: e.target.value })} />
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Amount ($)</label>
              <input className="form-input" type="number" step="0.01" min="0" value={editForm.Amount}
                onChange={e => setEditForm({ ...editForm, Amount: e.target.value })} />
            </div>
            <div className="form-group">
              <label className="form-label">Date</label>
              <input className="form-input" type="date" value={editForm.Date} onChange={e => setEditForm({ ...editForm, Date: e.target.value })} />
            </div>
          </div>

          <div className="form-group">
            <label className="form-label">Who Paid?</label>
            <div style={{display:'flex',flexWrap:'wrap',gap:8,padding:'8px 10px',border:'1px solid var(--border)',borderRadius:8}}>
              {familyOptions.map(family => (
                <label key={`paid-${family}`} style={{display:'flex',alignItems:'center',gap:5,fontSize:'.82rem',cursor:'pointer',padding:'3px 6px',borderRadius:6,background:(editForm.paidFamilies||[]).includes(family)?'#dcfce7':'transparent'}}>
                  <input type="checkbox"
                    checked={(editForm.paidFamilies || []).includes(family)}
                    onChange={e => toggleFamilyValue('paidFamilies', family, e.target.checked)}
                  />
                  {family}
                </label>
              ))}
            </div>
            <div style={{fontSize:'.72rem',color:'var(--muted)',marginTop:4}}>Leave empty to auto-map from volunteer.</div>
          </div>

          <div className="form-group">
            <label className="form-label">Cost Split by Family</label>
            <div style={{fontSize:'.74rem',color:'var(--muted)',marginBottom:8}}>
              Uncheck to exclude a family. Adjust "Sharing" count to split with fewer members.
            </div>
            {(() => {
              const amount = parseFloat(editForm.Amount) || 0;
              const splitFams = editForm.splitFamilies || [];
              const totalSharing = splitFams.reduce((sum, fam) => {
                const max = familyMembersMap[fam] || 0;
                const custom = editForm.customCounts?.[fam];
                return sum + (Number.isFinite(custom) ? Math.min(custom, max) : max);
              }, 0);
              const perPerson = totalSharing > 0 ? amount / totalSharing : 0;
              return (
                <div>
                  <div style={{display:'flex',gap:20,marginBottom:10,padding:'10px 14px',background:'#f0fdf4',borderRadius:8,border:'1px solid #bbf7d0',flexWrap:'wrap'}}>
                    <div>
                      <span style={{fontWeight:800,color:'var(--green)',fontSize:'1.05rem'}}>{totalSharing}</span>
                      <span style={{fontSize:'.72rem',color:'var(--muted)',marginLeft:5}}>members sharing</span>
                    </div>
                    <div>
                      <span style={{fontWeight:800,color:'var(--green)',fontSize:'1.05rem'}}>${perPerson.toFixed(2)}</span>
                      <span style={{fontSize:'.72rem',color:'var(--muted)',marginLeft:5}}>per person</span>
                    </div>
                    <div>
                      <span style={{fontWeight:800,color:'var(--green)',fontSize:'1.05rem'}}>${amount.toFixed(2)}</span>
                      <span style={{fontSize:'.72rem',color:'var(--muted)',marginLeft:5}}>total</span>
                    </div>
                  </div>
                  <div style={{border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
                    <div style={{display:'grid',gridTemplateColumns:'28px 1fr 50px 72px 74px',padding:'6px 10px',background:'var(--bg)',fontSize:'.7rem',fontWeight:700,color:'var(--muted)',borderBottom:'1px solid var(--border)'}}>
                      <div></div>
                      <div>Family</div>
                      <div style={{textAlign:'center'}}>Total</div>
                      <div style={{textAlign:'center'}}>Sharing</div>
                      <div style={{textAlign:'right'}}>Family $</div>
                    </div>
                    {familyOptions.map((family, idx) => {
                      const included = splitFams.includes(family);
                      const maxMembers = familyMembersMap[family] || 0;
                      const custom = editForm.customCounts?.[family];
                      const countVal = included ? (Number.isFinite(custom) ? custom : maxMembers) : 0;
                      const familyCost = included ? countVal * perPerson : 0;
                      const isLast = idx === familyOptions.length - 1;
                      return (
                        <div key={family} style={{
                          display:'grid',
                          gridTemplateColumns:'28px 1fr 50px 72px 74px',
                          alignItems:'center',
                          padding:'9px 10px',
                          borderBottom: isLast ? 'none' : '1px solid var(--border)',
                          background: included ? 'var(--card)' : '#f9fafb',
                          opacity: included ? 1 : 0.5,
                          transition:'opacity .15s',
                        }}>
                          <input type="checkbox" checked={included} style={{cursor:'pointer'}}
                            onChange={e => {
                              const on = e.target.checked;
                              const nextFams = on ? [...splitFams, family] : splitFams.filter(f => f !== family);
                              const nextCounts = { ...(editForm.customCounts || {}) };
                              if (!on) delete nextCounts[family];
                              setEditForm({ ...editForm, splitFamilies: nextFams, customCounts: nextCounts });
                            }}
                          />
                          <div style={{fontWeight:600,fontSize:'.85rem'}}>{family}</div>
                          <div style={{textAlign:'center',fontSize:'.8rem',color:'var(--muted)'}}>{maxMembers}</div>
                          <div style={{textAlign:'center'}}>
                            {included ? (
                              <input
                                type="number" min="1" max={String(maxMembers)} value={rawCounts[family] !== undefined ? rawCounts[family] : countVal}
                                onChange={e => {
                                  const raw = e.target.value;
                                  setRawCounts(prev => ({ ...prev, [family]: raw }));
                                  const n = parseInt(raw);
                                  if (!isNaN(n)) {
                                    const bounded = Math.max(1, Math.min(maxMembers || 1, n));
                                    setEditForm(prev => ({ ...prev, customCounts: { ...(prev.customCounts || {}), [family]: bounded } }));
                                  }
                                }}
                                style={{width:50,padding:'3px 5px',border:'1.5px solid var(--border)',borderRadius:6,textAlign:'center',fontSize:'.82rem',outline:'none'}}
                                onFocus={e => { e.target.style.borderColor='var(--green2)'; }}
                                onBlur={e => {
                                  const n = parseInt(rawCounts[family]);
                                  const bounded = isNaN(n) ? countVal : Math.max(1, Math.min(maxMembers || 1, n));
                                  setRawCounts(prev => { const next = { ...prev }; delete next[family]; return next; });
                                  setEditForm(prev => ({ ...prev, customCounts: { ...(prev.customCounts || {}), [family]: bounded } }));
                                  e.target.style.borderColor = 'var(--border)';
                                }}
                              />
                            ) : (
                              <span style={{fontSize:'.8rem',color:'var(--muted)'}}>—</span>
                            )}
                          </div>
                          <div style={{textAlign:'right',fontWeight:700,fontSize:'.85rem',color:included?'var(--green)':'var(--muted)'}}>
                            {included ? `$${familyCost.toFixed(2)}` : '—'}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                  {splitFams.length === 0 && (
                    <div style={{fontSize:'.74rem',color:'#b45309',marginTop:6}}>Select at least one family for the split.</div>
                  )}
                </div>
              );
            })()}
          </div>

          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setEditExpense(null)} disabled={savingEdit}>Cancel</button>
            <button className="btn btn-primary" onClick={handleSaveEdit}
              disabled={savingEdit || (familyOptions.length > 0 && (editForm.splitFamilies || []).length === 0)}>
              {savingEdit ? 'Saving…' : 'Save Changes'}
            </button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── SIGNUPS ──────────────────────────────────────────────────────────────────
function SignupsView() {
  const { data, loading, reload } = useData('getSignups');
  const [showAdd, setShowAdd]     = React.useState(false);
  const [form, setForm] = React.useState({ Name:'', Family:'', Members:1, Nights:1, Email:'', 'Dietary Notes':'' });

  const totalPeople = React.useMemo(() =>
    (data||[]).reduce((s,p) => s + (parseInt(p.Members)||0), 0), [data]);

  const handleAdd = async () => {
    if (!form.Name.trim()) return;
    if (USE_MOCK_DATA) mockState.signups.push({ ...form, _row: mockState.signups.length+2, 'Signed Up At': new Date().toISOString() });
    await api.post({ action:'addSignup', data: form });
    setShowAdd(false);
    reload();
  };

  if (loading) return <div className="empty-state"><div className="emoji">⏳</div><p>Loading signups…</p></div>;

  return (
    <div>
      <div className="section-header">
        <div>
          <div className="section-title">📝 Signups</div>
          <div className="text-muted" style={{marginTop:4}}>
            {(data||[]).length} families · {totalPeople} total campers
          </div>
        </div>
        <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(true)}>+ Sign Up</button>
      </div>

      <div style={{background:'linear-gradient(135deg,var(--green),var(--green2))',borderRadius:'var(--radius)',padding:'24px 20px',color:'#fff',marginBottom:20,textAlign:'center'}}>
        <div style={{fontSize:'3rem',fontWeight:900,lineHeight:1}}>{totalPeople}</div>
        <div style={{opacity:.85,marginTop:6,fontSize:'.9rem'}}>Total Campers Registered 🏕️</div>
      </div>

      {[...(data||[])].sort((a,b) => (parseInt(b.Members)||0) - (parseInt(a.Members)||0)).map((p,i) => (
        <div key={i} className="signup-card">
          <div className="signup-avatar">{(p.Name||'?').charAt(0).toUpperCase()}</div>
          <div style={{flex:1}}>
            <div style={{fontWeight:700}}>{p.Name}</div>
            <div style={{fontSize:'.78rem',color:'var(--muted)'}}>
              👨‍👩‍👧 {p.Family} · {p.Members} {parseInt(p.Members)===1?'person':'people'}
            </div>
            {p['Dietary Notes'] && p['Dietary Notes'] !== 'None' && (
              <div style={{fontSize:'.72rem',color:'#d97706',marginTop:3}}>⚠️ {p['Dietary Notes']}</div>
            )}
          </div>
          <div style={{fontSize:'.78rem',color:'var(--muted)',textAlign:'right',flexShrink:0}}>
            🌙 {parseInt(p.Nights)||1} {parseInt(p.Nights)===1?'night':'nights'}
          </div>
        </div>
      ))}

      {showAdd && (
        <Modal title="🏕️ Sign Up for Camping!" onClose={() => setShowAdd(false)}>
          <div className="form-group">
            <label className="form-label">Your Name *</label>
            <input className="form-input" placeholder="Full name" value={form.Name} onChange={e => setForm({...form,Name:e.target.value})} />
          </div>
          <div className="form-row">
            <div className="form-group">
              <label className="form-label">Family / Group</label>
              <input className="form-input" placeholder="e.g. The Smiths" value={form.Family} onChange={e => setForm({...form,Family:e.target.value})} />
            </div>
            <div className="form-group">
              <label className="form-label"># of People</label>
              <input className="form-input" type="number" min="1" value={form.Members} onChange={e => setForm({...form,Members:parseInt(e.target.value)||1})} />
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Number of Nights</label>
            <div style={{display:'flex',gap:12,marginTop:4}}>
              {[1,2].map(n => (
                <label key={n} style={{display:'flex',alignItems:'center',gap:6,cursor:'pointer',fontWeight:form.Nights===n?700:'normal'}}>
                  <input type="radio" name="nights" value={n} checked={form.Nights===n} onChange={() => setForm({...form,Nights:n})} />
                  🌙 {n} {n===1?'night':'nights'}
                </label>
              ))}
            </div>
          </div>
          <div className="form-group">
            <label className="form-label">Email</label>
            <input className="form-input" type="email" placeholder="you@example.com" value={form.Email} onChange={e => setForm({...form,Email:e.target.value})} />
          </div>
          <div className="form-group">
            <label className="form-label">Dietary Notes / Allergies</label>
            <input className="form-input" placeholder="e.g. Vegetarian x2, Nut allergy" value={form['Dietary Notes']} onChange={e => setForm({...form,'Dietary Notes':e.target.value})} />
          </div>
          <div className="modal-actions">
            <button className="btn btn-outline" onClick={() => setShowAdd(false)}>Cancel</button>
            <button className="btn btn-primary" onClick={handleAdd}>Sign Me Up! 🎉</button>
          </div>
        </Modal>
      )}
    </div>
  );
}

// ─── VOLUNTEERS ───────────────────────────────────────────────────────────────
function VolunteersView() {
  const { data: volunteers, loading }          = useData('getVolunteers');
  const { data: shopping, setData: setShopping } = useData('getShopping');
  const [pendingRow, setPendingRow] = React.useState(null);

  const itemsByVolunteer = React.useMemo(() => {
    return (shopping||[]).reduce((acc, item) => {
      const rawVolunteer = String(item.Volunteer || '').trim();
      const match = (volunteers || []).find(v => matchesVolunteer(rawVolunteer, v.Name));
      const key = match ? match.Name : (rawVolunteer || 'Unassigned');
      if (!acc[key]) acc[key] = [];
      acc[key].push(item);
      return acc;
    }, {});
  }, [shopping, volunteers]);

  const toggleStatus = async (item) => {
    if (pendingRow !== null) return;
    setPendingRow(item._row);
    try {
      const newStatus = isDone(item.Status) ? 'Pending' : 'Purchased';
      if (USE_MOCK_DATA) {
        const idx = mockState.shopping.findIndex(i => i._row === item._row);
        if (idx !== -1) mockState.shopping[idx].Status = newStatus;
      }
      await api.post({ action:'updateStatus', id:item.ID, row:item._row, status:newStatus });
      setShopping(prev => prev.map(i => i._row === item._row ? {...i, Status:newStatus} : i));
    } finally {
      setPendingRow(null);
    }
  };

  if (loading) return <div className="empty-state"><div className="emoji">⏳</div><p>Loading volunteers…</p></div>;

  return (
    <div>
      <div className="section-header">
        <div className="section-title">🙋 Volunteers</div>
      </div>
      {(volunteers||[]).map((v,i) => {
        const items = itemsByVolunteer[v.Name] || [];
        const done  = items.filter(i => isDone(i.Status)).length;
        return (
          <div key={i} className="card">
            <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:items.length>0?12:0}}>
              <div style={{width:46,height:46,borderRadius:12,background:'linear-gradient(135deg,var(--green2),var(--green3))',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:800,fontSize:'1.15rem',flexShrink:0}}>
                {v.Name.charAt(0)}
              </div>
              <div style={{flex:1}}>
                <div style={{fontWeight:700}}>{v.Name}</div>
                <div style={{fontSize:'.78rem',color:'var(--muted)'}}>👨‍👩‍👧 {v.Family} · 🏪 {v['Assigned Store']}</div>
              </div>
              <div style={{textAlign:'right'}}>
                <div style={{fontWeight:800,color: done===items.length && items.length>0 ? 'var(--green)' : 'var(--text)'}}>{done}/{items.length}</div>
                <div style={{fontSize:'.7rem',color:'var(--muted)'}}>items done</div>
              </div>
            </div>
            {items.length > 0 && (
              <div style={{borderTop:'1px solid var(--border)',paddingTop:10}}>
                {items.map((item,j) => (
                  <button
                    key={j}
                    onClick={() => toggleStatus(item)}
                    disabled={pendingRow !== null}
                    style={{display:'flex',alignItems:'center',gap:8,padding:'6px 4px',fontSize:'.82rem',width:'100%',background:'none',border:'none',borderRadius:6,cursor:pendingRow===null?'pointer':'default',textAlign:'left',transition:'background .15s'}}
                    onMouseEnter={e => { if(pendingRow===null) e.currentTarget.style.background='var(--hover,rgba(0,0,0,.04))'; }}
                    onMouseLeave={e => { e.currentTarget.style.background='none'; }}
                  >
                    <span style={{fontSize:'1rem'}}>{pendingRow===item._row ? '⏳' : isDone(item.Status) ? '✅' : '⬜'}</span>
                    <span style={{flex:1,textDecoration:isDone(item.Status)?'line-through':'none',color:isDone(item.Status)?'var(--muted)':'var(--text)'}}>
                      {item.Item}
                    </span>
                    <span style={{color:'var(--muted)',fontSize:'.72rem'}}>{item.Quantity}</span>
                  </button>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── MY VIEW ──────────────────────────────────────────────────────────────────
function MyView({ myName, saveName }) {
  const { data: volunteers } = useData('getVolunteers');
  const { data: shopping, setData: setShopping } = useData('getShopping');
  const { data: schedule }  = useData('getSchedule');
  const { data: expenses }  = useData('getExpenses');
  const [pendingRow, setPendingRow] = React.useState(null);
  const [editItem, setEditItem] = React.useState(null);

  const handleSaveEdit = async (item, form) => {
    if (USE_MOCK_DATA) {
      const idx = mockState.shopping.findIndex(i => i._row === item._row);
      if (idx !== -1) mockState.shopping[idx] = { ...mockState.shopping[idx], ...form };
    }
    await api.post({ action: 'updateShoppingItem', id: item.ID, row: item._row, data: form });
    setShopping(prev => prev.map(i => i._row === item._row ? { ...i, ...form } : i));
  };

  const myItems    = React.useMemo(() => (shopping||[]).filter(i => matchesVolunteer(i.Volunteer, myName)), [shopping, myName]);
  const mySchedule = React.useMemo(() => (schedule||[]).filter(i => matchesVolunteer(i['Assigned Volunteer'], myName) || normalizeText(i['Assigned Volunteer']) === 'all'), [schedule, myName]);
  const myExpenses = React.useMemo(() => (expenses||[]).filter(e => normalizeText(e.Volunteer) === normalizeText(myName)), [expenses, myName]);
  const myTotal    = myExpenses.reduce((s, e) => s + (parseFloat(e.Amount)||0), 0);
  const myDone     = myItems.filter(i => isDone(i.Status)).length;

  const toggleStatus = async (item) => {
    if (pendingRow !== null) return;
    setPendingRow(item._row);
    try {
      const newStatus = isDone(item.Status) ? 'Pending' : 'Purchased';
      if (USE_MOCK_DATA) {
        const idx = mockState.shopping.findIndex(i => i._row === item._row);
        if (idx !== -1) mockState.shopping[idx].Status = newStatus;
      }
      await api.post({ action:'updateStatus', id:item.ID, row:item._row, status:newStatus });
      setShopping(prev => prev.map(i => i._row === item._row ? {...i, Status:newStatus} : i));
    } finally {
      setPendingRow(null);
    }
  };

  if (!myName) {
    return (
      <div>
        <div className="empty-state" style={{paddingTop:50}}>
          <div className="emoji">👤</div>
          <p style={{fontWeight:700,fontSize:'1.1rem',marginBottom:6}}>Who are you?</p>
          <p style={{marginBottom:24,fontSize:'.88rem'}}>Pick your name to see only your tasks.</p>
          <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:300,margin:'0 auto'}}>
            {(volunteers||[]).map(v => (
              <button key={v.Name} className="btn btn-outline"
                style={{textAlign:'left',padding:'12px 16px',display:'flex',alignItems:'center',gap:12}}
                onClick={() => saveName(v.Name)}>
                <div style={{width:36,height:36,borderRadius:10,background:'linear-gradient(135deg,var(--green2),var(--green3))',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:800,flexShrink:0}}>
                  {v.Name.charAt(0)}
                </div>
                <div>
                  <div style={{fontWeight:700}}>{v.Name}</div>
                  <div style={{fontSize:'.75rem',color:'var(--muted)'}}>{v.Family} · {v['Assigned Store']}</div>
                </div>
              </button>
            ))}
          </div>
        </div>
      </div>
    );
  }

  return (
    <div>
      {/* Identity bar */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20,padding:'12px 16px',background:'var(--card)',borderRadius:'var(--radius)',boxShadow:'var(--shadow)'}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:42,height:42,borderRadius:12,background:'linear-gradient(135deg,var(--green2),var(--green3))',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:800,fontSize:'1.15rem',flexShrink:0}}>
            {myName.charAt(0)}
          </div>
          <div>
            <div style={{fontWeight:700}}>Hi, {myName}! 👋</div>
            <div style={{fontSize:'.75rem',color:'var(--muted)'}}>Your personal task view</div>
          </div>
        </div>
        <button className="btn btn-outline btn-sm" onClick={() => saveName('')}>Change</button>
      </div>

      {/* Stats */}
      <div className="stats-grid" style={{marginBottom:20}}>
        <div className="stat-card">
          <div className="stat-value">{myDone}/{myItems.length}</div>
          <div className="stat-label">Items Bought</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">{mySchedule.filter(i => i['Assigned Volunteer'] !== 'All').length}</div>
          <div className="stat-label">My Duties</div>
        </div>
        <div className="stat-card">
          <div className="stat-value">${myTotal.toFixed(2)}</div>
          <div className="stat-label">I've Spent</div>
        </div>
      </div>

      {/* My Shopping */}
      <div className="card">
        <div className="card-header">
          <div className="card-title">🛒 My Shopping</div>
          <span style={{fontSize:'.78rem',color: myDone===myItems.length && myItems.length>0 ? 'var(--green)' : 'var(--muted)',fontWeight:600}}>
            {myItems.length === 0 ? 'none assigned' : myDone===myItems.length ? '✓ All done!' : `${myDone} of ${myItems.length} done`}
          </span>
        </div>
        {myItems.length === 0 ? (
          <div style={{color:'var(--muted)',fontSize:'.85rem',padding:'4px 0 8px'}}>No items assigned to you.</div>
        ) : (
          <div className="item-tiles-grid">
            {myItems.map(item => {
              const isLoading = pendingRow === item._row;
              return (
                <button key={item._row}
                  className={`item-tile${isDone(item.Status) ? ' item-tile--done' : ''}${isLoading ? ' item-tile--loading' : ''}`}
                  onClick={() => toggleStatus(item)}
                  disabled={pendingRow !== null}>
                  <div className="item-tile-edit-btn"
                    onClick={e => { e.stopPropagation(); setEditItem(item); }}
                    title="Edit item"
                  >✏️</div>
                  {isLoading
                    ? <div className="item-tile-spinner" />
                    : isDone(item.Status) && <div className="item-tile-check">✓</div>
                  }
                  <div className="item-tile-name">{item.Item}</div>
                  <div className="item-tile-qty">{item.Quantity}</div>
                  <div className="item-tile-meal">{MEAL_ICONS[item.Meal] || '🍽️'} {item.Meal}</div>
                </button>
              );
            })}
          </div>
        )}
      </div>

      {/* My Schedule */}
      <div className="card">
        <div className="card-header"><div className="card-title">📅 My Schedule</div></div>
        {mySchedule.length === 0 ? (
          <div style={{color:'var(--muted)',fontSize:'.85rem',padding:'4px 0 8px'}}>No schedule items assigned to you.</div>
        ) : (
          mySchedule.map((item, i) => (
            <div key={i} style={{display:'flex',alignItems:'flex-start',gap:10,padding:'10px 0',borderBottom: i < mySchedule.length-1 ? '1px solid var(--border)' : 'none'}}>
              <div className="meal-icon" style={{background: MEAL_COLORS[item.Meal] || '#f3f4f6', flexShrink:0}}>
                {MEAL_ICONS[item.Meal] || '📌'}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:'.75rem',color:'var(--muted)',fontWeight:600}}>Day {item.Day} · {item.Meal}{item['Assigned Volunteer']==='All' ? ' · 👥 Everyone' : ''}</div>
                <div style={{fontWeight:700,fontSize:'.88rem',marginTop:1}}>{item.Item}</div>
                {item.Details && <div style={{fontSize:'.76rem',color:'var(--muted)',marginTop:2}}>{item.Details}</div>}
              </div>
            </div>
          ))
        )}
      </div>

      {/* My Expenses */}
      {myExpenses.length > 0 && (
        <div className="card">
          <div className="card-header">
            <div className="card-title">💸 My Expenses</div>
            <span style={{fontWeight:800,color:'var(--green)'}}>${myTotal.toFixed(2)}</span>
          </div>
          {myExpenses.map((e, i) => (
            <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom: i < myExpenses.length-1 ? '1px solid var(--border)' : 'none'}}>
              <div>
                <div style={{fontWeight:600,fontSize:'.85rem'}}>{e.Item}</div>
                <div style={{fontSize:'.73rem',color:'var(--muted)'}}>{e.Store} · {e.Date}</div>
              </div>
              <div style={{fontWeight:700,color:'var(--green)'}}>${Number(e.Amount).toFixed(2)}</div>
            </div>
          ))}
        </div>
      )}

      {editItem && (
        <EditItemModal
          item={editItem}
          volunteers={volunteers}
          onClose={() => setEditItem(null)}
          onSave={handleSaveEdit}
        />
      )}
    </div>
  );
}

// ─── SYNC BUTTON ──────────────────────────────────────────────────────────────
function SyncButton() {
  const { isOnline, isSyncing, lastSyncAt, pendingCount, sync } = React.useContext(SyncContext);
  const [, tick] = React.useReducer(x => x + 1, 0);

  // Re-render every 30s so "X min ago" text stays current
  React.useEffect(() => { const t = setInterval(tick, 30000); return () => clearInterval(t); }, []);

  const label = () => {
    if (!isOnline) return pendingCount > 0 ? `Offline · ${pendingCount} pending` : 'Offline';
    if (isSyncing) return 'Syncing…';
    if (!lastSyncAt) return 'Sync now';
    const mins = Math.round((Date.now() - lastSyncAt) / 60000);
    if (mins < 1) return 'Just now';
    if (mins === 1) return '1 min ago';
    if (mins < 60) return `${mins}m ago`;
    return `${Math.floor(mins / 60)}h ago`;
  };

  return (
    <button
      className={`sync-btn${!isOnline ? ' offline' : ''}`}
      onClick={sync}
      disabled={isSyncing || !isOnline}
      title={isOnline ? 'Sync with Google Sheets' : 'You are offline'}
    >
      <span className={`sync-icon${isSyncing ? ' spin' : ''}`}>⟳</span>
      <span>{label()}</span>
      {pendingCount > 0 && !isSyncing && <span className="sync-badge">{pendingCount}</span>}
    </button>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
const TABS = [
  { id:'myview',     label:'👤 My View'   },
  { id:'schedule',   label:'📅 Schedule'  },
  { id:'shopping',   label:'🛒 Shopping'  },
  { id:'expenses',   label:'💰 Expenses'  },
  { id:'signups',    label:'📝 Signups'   },
  { id:'volunteers', label:'🙋 Volunteers'},
];

function App() {
  const [tab, setTab]       = React.useState('myview');
  const [myName, setMyName] = React.useState(() => localStorage.getItem('camping_my_name') || '');
  const { isOnline, pendingCount } = React.useContext(SyncContext);

  const saveName = (name) => {
    setMyName(name);
    localStorage.setItem('camping_my_name', name);
  };

  const tabLabel = (t) => {
    if (t.id === 'myview') return myName ? `👤 ${myName.split(' ')[0]}` : '👤 My View';
    return t.label;
  };

  return (
    <div>
      <div className="app-header">
        <div className="header-top">
          <h1>🏕️ Camping Planner</h1>
          <SyncButton />
        </div>
        <div className="nav-tabs">
          {TABS.map(t => (
            <button key={t.id}
              className={`nav-tab ${tab===t.id?'active':''}`}
              onClick={() => setTab(t.id)}>
              {tabLabel(t)}
            </button>
          ))}
        </div>
      </div>
      <div className="page">
        {!isOnline && (
          <div className="offline-banner">
            <span>📵</span>
            <span>You're offline — showing cached data.{pendingCount > 0 ? ` ${pendingCount} change${pendingCount !== 1 ? 's' : ''} will sync on reconnect.` : ''}</span>
          </div>
        )}
        {USE_MOCK_DATA && (
          <div className="config-banner">
            <span>⚠️</span>
            <div>
              <strong>Demo Mode</strong> — using sample data.
              To connect live Google Sheets: deploy <code>apps-script/Code.gs</code> as a Web App,
              paste the URL into <code>APPS_SCRIPT_URL</code> at the top of this file,
              then set <code>USE_MOCK_DATA = false</code>.
            </div>
          </div>
        )}
        {tab === 'myview'    && <MyView myName={myName} saveName={saveName} />}
        {tab === 'schedule'  && <ScheduleView />}
        {tab === 'shopping'  && <ShoppingView myName={myName} saveName={saveName} />}
        {tab === 'expenses'  && <ExpensesView />}
        {tab === 'signups'   && <SignupsView />}
        {tab === 'volunteers' && <VolunteersView />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<SyncProvider><App /></SyncProvider>);
</script>
</body>
</html>
